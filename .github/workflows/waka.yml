name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      # 下载已核对的 Action 源码，临时补充 OAuth 支持。
      - name: Download Waka Readme action
        uses: actions/checkout@v4
        with:
          repository: anmol098/waka-readme-stats
          ref: 4db28e08bfd8bac570125799fe1cfdcb23a8c871
          path: .waka-action
          persist-credentials: false

      - name: Enable WakaTime OAuth authentication
        shell: python
        run: |
          from pathlib import Path

          source = Path('.waka-action/sources/manager_download.py')
          text = source.read_text(encoding='utf-8')
          old_query = '?api_key={EM.WAKATIME_API_KEY}'
          if text.count(old_query) != 2:
              raise SystemExit('Unexpected WakaTime source; review OAuth patch.')
          text = text.replace(old_query, '')
          old_get = 'DownloadManager._client.get(url)'
          new_get = '''DownloadManager._client.get(
              url,
              headers={"Authorization": f"Bearer {EM.WAKATIME_API_KEY}"}
              if url.startswith(EM.WAKATIME_API_URL) else {},
          )'''
          if text.count(old_get) != 1:
              raise SystemExit('Unexpected download source; review OAuth patch.')
          text = text.replace(old_get, new_get)
          # 202 表示统计仍在生成，等待后重试；避免发布缺少统计的 README。
          old_status = '        if res.status_code == 200:\n            if convertor is None:'
          retry = '\n'.join([
              '        if resource.startswith("waka_"):',
              '            for attempt in range(12):',
              '                if res.status_code != 202:',
              '                    break',
              '                DBM.i(f"WakaTime stats are processing; retry {attempt + 1}/12...")',
              '                await asyncio.sleep(15)',
              '                res = await DownloadManager._client.get(',
              '                    str(res.url),',
              '                    headers={"Authorization": f"Bearer {EM.WAKATIME_API_KEY}"},',
              '                )',
              '                DownloadManager._REMOTE_RESOURCES_CACHE[resource] = res',
              '            if res.status_code == 202:',
              '                raise RuntimeError("WakaTime stats still processing. README was not pushed. Run workflow again later.")',
              '',
          ])
          if text.count(old_status) != 1:
              raise SystemExit('Unexpected response handling; review retry patch.')
          text = text.replace(old_status, retry + old_status)
          compile(text, str(source), 'exec')
          source.write_text(text, encoding='utf-8')

          # 将 Token 放在 HTTPS 密码位置，使用标准 GitHub 推送认证。
          git_source = Path('.waka-action/sources/manager_github.py')
          git_text = git_source.read_text(encoding='utf-8')
          old_url = 'https://{push_token}@github.com/'
          if git_text.count(old_url) != 1:
              raise SystemExit('Unexpected Git authentication source; review patch.')
          git_text = git_text.replace(old_url, 'https://x-access-token:{push_token}@github.com/')
          compile(git_text, str(git_source), 'exec')
          git_source.write_text(git_text, encoding='utf-8')

          action = Path('.waka-action/action.yml')
          text = action.read_text(encoding='utf-8')
          old_image = "image: 'docker://wakareadmestats/waka-readme-stats:master'"
          if text.count(old_image) != 1:
              raise SystemExit('Unexpected action image; review OAuth patch.')
          action.write_text(text.replace(old_image, "image: 'Dockerfile'"), encoding='utf-8')

      - name: Update README
        uses: ./.waka-action
        with:
          # 此 Secret 填写 WakaTime 个人 OAuth Token，名称保留以兼容原 Action。
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}
          LOCALE: en
          SHOW_LINES_OF_CODE: "True"
          SHOW_LOC_CHART: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_OS: "True"
          SHOW_PROJECTS: "False"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_COMMIT: "True"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SYMBOL_VERSION: "2"
          SHOW_AI_CODING: "False"
